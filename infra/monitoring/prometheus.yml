global-config:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'homevision-gateway'
    static_configs:
      - targets: ['api-gateway:80']

  - job_name: 'homevision-auth'
    static_configs:
      - targets: ['auth-service:80']

  - job_name: 'homevision-orchestration'
    static_configs:
      - targets: ['orchestration-service:80']

  - job_name: 'homevision-tv'
    static_configs:
      - targets: ['tv-integration-service:3000']
