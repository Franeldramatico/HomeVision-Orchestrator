version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: homevision-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./backend/database:/docker-entrypoint-initdb.d
    networks:
      - homevision-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 10

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: homevision-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - homevision-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Authentication Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: homevision-auth
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationHours=${JWT_EXPIRATION_HOURS}
    ports:
      - "${AUTH_SERVICE_PORT}:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - homevision-network

  # Orchestration Service (Rules Engine)
  orchestration-service:
    build:
      context: ./backend/orchestration-service
      dockerfile: Dockerfile
    container_name: homevision-orchestration
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true
      - Redis__ConnectionString=redis:${REDIS_PORT}
    ports:
      - "${ORCHESTRATION_SERVICE_PORT}:80"
    depends_on:
      - sqlserver
      - redis
    networks:
      - homevision-network

  # TV Integration Service (Node.js)
  tv-integration-service:
    build:
      context: ./backend/tv-integration-service/tv-service
      dockerfile: Dockerfile
    container_name: homevision-tv
    environment:
      - NODE_ENV=development
      - SAMSUNG_TV_IP=${SAMSUNG_TV_IP}
      - SAMSUNG_TV_PORT=${SAMSUNG_TV_PORT}
      - SAMSUNG_TV_TOKEN=${SAMSUNG_TV_TOKEN}
      - WS_PORT=${WS_PORT}
    ports:
      - "${TV_INTEGRATION_SERVICE_PORT}:3000"
      - "${WS_PORT}:8080"
    networks:
      - homevision-network

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: homevision-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__Auth=http://auth-service:80
      - Services__Orchestration=http://orchestration-service:80
      - Services__TvIntegration=http://tv-integration-service:3000
      - CorsOrigins=${CORS_ORIGINS}
    ports:
      - "${API_GATEWAY_PORT}:80"
    depends_on:
      - auth-service
      - orchestration-service
      - tv-integration-service
    networks:
      - homevision-network

  # Web SPA Frontend
  web-spa:
    build:
      context: ./frontend/web-spa
      dockerfile: Dockerfile
    container_name: homevision-web
    environment:
      - REACT_APP_API_URL=http://localhost:${API_GATEWAY_PORT}
      - REACT_APP_WS_URL=ws://localhost:${WS_PORT}
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - homevision-network

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: homevision-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - homevision-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: homevision-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - homevision-network

networks:
  homevision-network:
    driver: bridge

volumes:
  sqlserver-data:
  prometheus-data:
  grafana-data:
